[project]
name = "buff"
version = "0.1.0"
description = "BUFF: Boosted Decision Tree based Ultra-Fast Flow matching"
requires-python = ">=3.9"
dependencies = [
    "h5py",
    "matplotlib",
    "scikit-learn",
    "awkward>=2.5",
    "energyflow",
    "fastjet",
    "jetnet",
    "law",
    "uproot>=5",
    "weaver-core>=0.4",
    "wandb",
    "lightning",
    "pytorch-lightning",
    "torch>=1.11.0",
    "torchvision>=0.11.0",
    "lightning-bolts",
    "numpy",
    "scipy",
    "scprep",
    "scanpy",
    "torchdyn>=1.0.6",
    "torchdiffeq",
    "torchcfm",
    "xgboost",
    "hydra-colorlog==1.2.0",
    "hydra-core==1.3.2",
    "hydra-optuna-sweeper==1.2.0",
    "tqdm",
    "corner",
    "joblib",
    "pot",
    "ruff",
]

[tool.ruff]
line-length = 120
